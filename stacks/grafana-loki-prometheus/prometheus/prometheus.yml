global:
  scrape_interval: 4s
  evaluation_interval: 4s

scrape_configs:
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets: ["fastapi:8000"]

  - job_name: nextjs
    metrics_path: /api/metrics
    static_configs:
      - targets: ["nextjs:3000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Per-container CPU / memory / network (the "infrastructure" view)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
